<svg viewBox="0 0 24 24">
  <title>filter</title>
  <style>
    :host {
      --stroke-width: 2;
      --fill: none;
      --transition: none;
    }

    :host {
      font-size: 24px;
      stroke: inherit;
    }

    :host path {
      stroke: currentColor;
      stroke-width: var(--stroke-width);
      fill: var(--fill);
      transition: var(--transition);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ionic */
    :host(.ion-color) path {
      --stroke: var(--ion-color-base) !important;
    }
  </style>
